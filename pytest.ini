[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
norecursedirs = tests/fixtures .git __pycache__
# Keep the edit/deploy feedback loop fast. Run the complete regression suite
# before push/CI with: python -m pytest -o addopts=""
addopts = -m "not slow and not integration"
markers =
    integration: exercises real Git processes, browser infrastructure, or other system boundaries
    slow: exhaustive timeout or retry scenarios retained for the full regression suite
