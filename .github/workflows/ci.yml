name: Regression checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -o addopts='' --durations=20 -q
      - run: node tests/browser_extension.test.mjs
      - run: python -m tests.benchmarks.run --samples 20 --history 450
      - run: python -m tests.benchmarks.orchestration --tasks 4 --workers 2
